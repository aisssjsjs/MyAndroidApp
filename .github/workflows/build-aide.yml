name: Build AIDE APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 定位 Android SDK 路径
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_HOME 2>/dev/null || true
          find / -name "android.jar" 2>/dev/null | head -5
          find / -name "aapt2" 2>/dev/null | head -5
          find / -name "d8" 2>/dev/null | head -5

      - name: 查看项目结构
        run: |
          ls -la
          find . -name "*.java"
          cat AndroidManifest.xml
